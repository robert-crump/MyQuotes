plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.example.myquotes"
        minSdk 34
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "DRIVE_OAUTH_CLIENT_ID", "\"${localProperties.getProperty('drive.oauth.client.id', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests {
            returnDefaultValues true
            // The hashtag suggestion eval (#59) prints its report to stdout.
            all {
                testLogging {
                    showStandardStreams = true
                }
            }
        }
    }
    androidResources {
        // ONNX Runtime memory-maps the model straight from the APK (#62).
        noCompress 'onnx'
    }
    buildFeatures {
        viewBinding true
        buildConfig = true
    }
    namespace 'com.example.myquotes'
}

ext.onnxRuntimeVersion = '1.31.0'

// The Android AAR and the desktop jar have the same classes; unit tests run on the desktop one.
configurations.matching { it.name.endsWith('UnitTestRuntimeClasspath') }.configureEach {
    exclude group: 'com.microsoft.onnxruntime', module: 'onnxruntime-android'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.work:work-runtime:2.11.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    implementation 'com.google.android.gms:play-services-auth:21.6.0'

    // Text embeddings (#60), for the similar-quotes hashtag reason (#62).
    implementation "com.microsoft.onnxruntime:onnxruntime-android:$onnxRuntimeVersion"

    testImplementation 'junit:junit:4.13.2'
    // The desktop build of the same runtime, so unit tests measure what the app would ship.
    testImplementation "com.microsoft.onnxruntime:onnxruntime:$onnxRuntimeVersion"
    testImplementation 'org.json:json:20231013'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
// README screenshots from the demo collection (androidTest ReadmeScreenshots), on a running
// emulator: ./gradlew readmeScreenshots. Not part of CI.
abstract class ReadmeScreenshotsTask extends DefaultTask {
    static final String DEMO = 'com.android.systemui.demo'

    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @Internal abstract Property<File> getAdbExecutable()
    @Internal abstract RegularFileProperty getAppApk()
    @Internal abstract RegularFileProperty getTestApk()
    @Internal abstract Property<String> getApplicationId()
    @Internal abstract Property<String> getTestClass()
    @Internal abstract DirectoryProperty getPullDir()
    @Internal abstract DirectoryProperty getScreenshotsDir()

    @TaskAction
    void capture() {
        String serial = emulatorSerial()
        logger.lifecycle("Taking README screenshots on $serial")
        runAdb(serial, 'install', '-r', '-t', appApk.get().asFile.absolutePath)
        runAdb(serial, 'install', '-r', '-t', testApk.get().asFile.absolutePath)

        runAdb(serial, 'shell', 'settings', 'put', 'global', 'sysui_demo_allowed', '1')
        String output
        try {
            demo(serial, 'enter')
            demo(serial, 'clock', '-e', 'hhmm', '1200')
            demo(serial, 'battery', '-e', 'level', '100', '-e', 'plugged', 'false')
            demo(serial, 'network', '-e', 'wifi', 'show', '-e', 'level', '4', '-e', 'fully', 'true')
            demo(serial, 'notifications', '-e', 'visible', 'false')
            output = runAdb(serial, 'shell', 'am', 'instrument', '-w',
                    '-e', 'readmeScreenshots', 'true', '-e', 'class', testClass.get(),
                    "${applicationId.get()}.test/androidx.test.runner.AndroidJUnitRunner")
        } finally {
            demo(serial, 'exit')
        }
        logger.lifecycle(output.trim())
        // am instrument exits 0 even when a test fails.
        if (output.contains('FAILURES!!!') || !output.contains('OK (')) {
            throw new GradleException('The README screenshot test failed; see the output above.')
        }

        File pulled = pullDir.get().asFile
        pulled.deleteDir()
        pulled.mkdirs()
        runAdb(serial, 'pull',
                "/sdcard/Android/data/${applicationId.get()}/files/readme-screenshots",
                pulled.absolutePath)
        File[] pngs = new File(pulled, 'readme-screenshots').listFiles({ File f -> f.name.endsWith('.png') } as FileFilter)
        if (!pngs) throw new GradleException("No screenshots were pulled from $serial.")

        File target = screenshotsDir.get().asFile
        target.mkdirs()
        target.listFiles({ File f -> f.name.endsWith('.png') } as FileFilter).each { it.delete() }
        pngs.each { File png -> java.nio.file.Files.copy(png.toPath(), new File(target, png.name).toPath()) }
        logger.lifecycle("Saved ${pngs.collect { it.name }.sort().join(', ')} to $target")
    }

    /** The one running emulator (or ANDROID_SERIAL); real devices are never used. */
    String emulatorSerial() {
        String requested = System.getenv('ANDROID_SERIAL')
        if (requested) return requested
        List<String> emulators = runAdb(null, 'devices').readLines()
                .collect { it.split('\t') }
                .findAll { it.length == 2 && it[1] == 'device' && it[0].startsWith('emulator-') }
                .collect { it[0] }
        if (emulators.isEmpty()) {
            throw new GradleException('readmeScreenshots needs a running emulator; none found.')
        }
        if (emulators.size() > 1) {
            throw new GradleException("Several emulators are running ($emulators); pick one with ANDROID_SERIAL.")
        }
        return emulators[0]
    }

    void demo(String serial, String command, String... extras) {
        runAdb(serial, *(['shell', 'am', 'broadcast', '-a', DEMO, '-e', 'command', command] + extras.toList()))
    }

    String runAdb(String serial, String... args) {
        List<String> commandLine = [adbExecutable.get().absolutePath]
        if (serial) commandLine += ['-s', serial]
        commandLine += args.toList()
        def out = new ByteArrayOutputStream()
        execOperations.exec {
            it.commandLine(commandLine)
            it.standardOutput = out
        }
        return out.toString('UTF-8')
    }
}

tasks.register('readmeScreenshots', ReadmeScreenshotsTask) {
    group = 'documentation'
    description = 'Takes the README screenshots from the demo quotes on a running emulator.'
    dependsOn 'assembleDebug', 'assembleDebugAndroidTest'
    adbExecutable.set(android.adbExecutable)
    appApk.set(layout.buildDirectory.file('outputs/apk/debug/app-debug.apk'))
    testApk.set(layout.buildDirectory.file('outputs/apk/androidTest/debug/app-debug-androidTest.apk'))
    applicationId.set(android.defaultConfig.applicationId)
    testClass.set('com.example.myquotes.ReadmeScreenshots')
    pullDir.set(layout.buildDirectory.dir('readme-screenshots'))
    screenshotsDir.set(rootProject.layout.projectDirectory.dir('docs/screenshots'))
    outputs.upToDateWhen { false }
}

// Text embedding models for the semantic search bake-off (#60): ./gradlew downloadEmbeddingModels.
// Model files are too big to commit, so each one is fetched from Hugging Face at a pinned commit,
// checked against its SHA-256 and cached in the Gradle user home (outside the repo, kept by CI's
// Gradle cache). Unit tests depend on it and find the files through the system property
// myquotes.embeddingModels; tests that need a model are skipped when it is missing.
abstract class DownloadEmbeddingModelsTask extends DefaultTask {
    /** name, repo, revision, then path in the repo → SHA-256, per model. */
    @Input abstract ListProperty<Map<String, Object>> getModels()
    @Internal abstract DirectoryProperty getOutputDir()
    /** Without network, warn instead of failing (an offline test run still passes the rest). */
    @Input abstract Property<Boolean> getFailOnNetworkError()

    @TaskAction
    void download() {
        models.get().each { Map<String, Object> model ->
            File dir = new File(outputDir.get().asFile, "${model.name}/${model.revision}")
            dir.mkdirs()
            (model.files as Map<String, String>).each { String path, String sha256 ->
                File target = new File(dir, path.substring(path.lastIndexOf('/') + 1))
                File stamp = new File(dir, "${target.name}.sha256")
                if (target.isFile() && stamp.isFile() && stamp.text.trim() == "$sha256 ${target.length()}") return
                if (target.isFile() && sha256Of(target) == sha256) {
                    stamp.text = "$sha256 ${target.length()}"
                    return
                }
                String url = "https://huggingface.co/${model.repo}/resolve/${model.revision}/$path"
                File partial = new File(dir, "${target.name}.part")
                logger.lifecycle("Downloading $url")
                try {
                    URLConnection connection = new URL(url).openConnection()
                    connection.setRequestProperty('User-Agent', 'MyQuotes-build')
                    connection.connectTimeout = 30_000
                    connection.readTimeout = 60_000
                    connection.inputStream.withStream { input -> partial.withOutputStream { it << input } }
                } catch (IOException e) {
                    partial.delete()
                    if (failOnNetworkError.get()) throw new GradleException("Could not download $url", e)
                    logger.warn("Could not download $url ($e); tests that need ${model.name} will be skipped.")
                    return
                }
                String actual = sha256Of(partial)
                if (actual != sha256) {
                    partial.delete()
                    throw new GradleException("SHA-256 mismatch for $url: expected $sha256, got $actual")
                }
                target.delete()
                if (!partial.renameTo(target)) throw new GradleException("Could not move $partial to $target")
                stamp.text = "$sha256 ${target.length()}"
            }
        }
    }

    static String sha256Of(File file) {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        file.withInputStream { input ->
            byte[] buffer = new byte[1 << 16]
            int n
            while ((n = input.read(buffer)) > 0) digest.update(buffer, 0, n)
        }
        return digest.digest().encodeHex().toString()
    }
}

def embeddingModelsDir = new File(gradle.gradleUserHomeDir, 'caches/myquotes-embedding-models')

def downloadEmbeddingModels = tasks.register('downloadEmbeddingModels', DownloadEmbeddingModelsTask) {
    group = 'verification'
    description = 'Downloads the pinned text embedding models and tokenizers used by the unit tests.'
    // Keep in sync with TextEmbeddingModel (name and revision).
    models.set([
            [name: 'multilingual-e5-small', repo: 'Xenova/multilingual-e5-small',
             revision: '761b726dd34fb83930e26aab4e9ac3899aa1fa78',
             files: ['onnx/model_quantized.onnx': 'f80102d3f2a1229f387d3c81909990d8945513e347b0eab049f7de3c6f98c193',
                     'tokenizer.json': '0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39']],
            [name: 'paraphrase-multilingual-MiniLM-L12-v2', repo: 'Xenova/paraphrase-multilingual-MiniLM-L12-v2',
             revision: '2c4055b12046f11709e9df2c122e59ffbdc2f900',
             files: ['onnx/model_quantized.onnx': '66fc00f5f29afcaff34092e1bdd20008ca3918265a82fb9695a551e510cc4ebc',
                     'tokenizer.json': 'b60b6b43406a48bf3638526314f3d232d97058bc93472ff2de930d43686fa441']],
    ])
    outputDir.set(embeddingModelsDir)
    failOnNetworkError.set(gradle.startParameter.taskNames.any { it.endsWith('downloadEmbeddingModels') })
    outputs.upToDateWhen { false }
}

// ONNX Runtime on Windows needs msvcp140.dll 14.40 or newer, but the JVM loads the copy in its own
// bin folder first, and Android Studio's JBR ships 14.29: the native code then crashes the test JVM.
// Point unitTest.javaHome in local.properties at a newer JDK to run the ONNX tests on Windows;
// otherwise they are skipped there (CI runs on Linux).
def unitTestJavaHome = localProperties.getProperty('unitTest.javaHome')

/** The FileVersion of a Windows DLL as [major, minor], read from its VS_FIXEDFILEINFO. */
def dllVersion = { File dll ->
    byte[] bytes = dll.bytes
    for (int i = 0; i + 16 <= bytes.length; i += 4) {
        if ((bytes[i] & 0xFF) == 0xBD && (bytes[i + 1] & 0xFF) == 0x04
                && (bytes[i + 2] & 0xFF) == 0xEF && (bytes[i + 3] & 0xFF) == 0xFE) {
            def info = java.nio.ByteBuffer.wrap(bytes, i + 8, 4).order(java.nio.ByteOrder.LITTLE_ENDIAN)
            int fileVersionMs = info.getInt()
            return [fileVersionMs >>> 16, fileVersionMs & 0xFFFF]
        }
    }
    return null
}

tasks.withType(Test).configureEach {
    dependsOn downloadEmbeddingModels
    systemProperty 'myquotes.embeddingModels', embeddingModelsDir.absolutePath
    // Two 250k-entry vocabularies at once.
    maxHeapSize = '1g'
    if (unitTestJavaHome) {
        String exe = org.gradle.internal.os.OperatingSystem.current().getExecutableName('java')
        executable = new File(unitTestJavaHome, "bin/$exe").absolutePath
    }
    doFirst {
        if (!org.gradle.internal.os.OperatingSystem.current().isWindows()) return
        File javaHome = unitTestJavaHome ? new File(unitTestJavaHome) : new File(System.getProperty('java.home'))
        File dll = new File(javaHome, 'bin/msvcp140.dll')
        def version = dll.isFile() ? dllVersion(dll) : null
        if (version != null && (version[0] < 14 || (version[0] == 14 && version[1] < 40))) {
            String reason = "$dll is ${version.join('.')}, ONNX Runtime needs 14.40+; set unitTest.javaHome in local.properties to a newer JDK"
            logger.warn("ONNX embedding tests will be skipped: $reason")
            systemProperty 'myquotes.onnxSkipReason', reason
        }
    }
}

// The similar-quotes model chosen in ADR-006 ships in the APK (#62): its ONNX file and tokenizer go
// into the assets under embedding/ (the ONNX file uncompressed, see androidResources). Keep in sync
// with TextEmbeddingModel.PARAPHRASE_MULTILINGUAL_MINILM_L12. The other candidate is not packaged.
// Offline without the files the APK still builds; the app then suggests without the reason.
abstract class EmbeddingAssetsTask extends DefaultTask {
    @InputFiles @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getModelFiles()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copy() {
        File out = new File(outputDir.get().asFile, 'embedding')
        out.deleteDir()
        out.mkdirs()
        modelFiles.files.each { File source ->
            String name = source.name
            if (!source.isFile()) {
                logger.warn("$source is missing; the APK is built without the similar-quotes model.")
                return
            }
            java.nio.file.Files.copy(source.toPath(), new File(out, name).toPath())
        }
    }
}

def embeddingAssets = tasks.register('embeddingAssets', EmbeddingAssetsTask) {
    dependsOn downloadEmbeddingModels
    File modelDir = new File(embeddingModelsDir,
            'paraphrase-multilingual-MiniLM-L12-v2/2c4055b12046f11709e9df2c122e59ffbdc2f900')
    modelFiles.from(new File(modelDir, 'model_quantized.onnx'), new File(modelDir, 'tokenizer.json'))
    outputDir.set(layout.buildDirectory.dir('generated/embeddingAssets'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(embeddingAssets, { it.outputDir })
    }
}
